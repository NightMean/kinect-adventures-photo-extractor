[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinect-adventures-photo-extractor"
version = "0.1.0"
description = "Recover embedded Kinect Adventures JPEG photos locally"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
kinect-photos = "kinect_photos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kinect_photos = ["messages.json"]
